# 每台机器各自复制一份为 config.local.yaml，并填写自己的敏感配置。
# 这个文件不进入版本控制。
#
# proxy-providers 整体放在本地文件里维护，因为不同机场的 provider 结构差异可能很大。

proxy-providers:
  provider1:
    url: "https://example.com/your-subscription"
    type: http
    interval: 21600
    path: ./proxy_providers/nano.yaml # 关键：固定落盘位置，方便你对比
    header:
      User-Agent:
        - "FlClash/v0.8.94 clash-verge Platform/windows"
    health-check:
      {
        enable: true,
        url: "https://www.gstatic.com/generate_204",
        interval: 3600,
        lazy: true,
      }
    override:
      additional-prefix: "[nano]"

  # provider2:
  #   url: "https://example.com/your-subscription"
  #   type: http
  #   interval: 21600
  #   path: ./proxy_providers/your-subscriptiono.yaml # 关键：固定落盘位置，方便你对比
  #   header:
  #     User-Agent:
  #       - "FlClash/v0.8.94 clash-verge Platform/windows"
  #   health-check:
  #     {
  #       enable: true,
  #       url: "https://www.gstatic.com/generate_204",
  #       interval: 300,
  #       lazy: true,
  #     }
  #   override:
  #     additional-prefix: "[your-subscription]"

# 可选：为有独立使用限制的订阅加用途前缀，供策略组过滤。
# 这是通用示例；请不要把实际订阅链接提交到仓库。
#
#   special-provider:
#     type: http
#     url: "https://example.com/private-subscription"
#     interval: 21600
#     path: ./proxy_providers/special.yaml
#     override:
#       additional-prefix: "[AI-ONLY] "
#
# 若订阅里所有节点属于同一地区，可以在前缀后附加对应国旗；
# 混合地区订阅则不要统一标记国家。
#
# 机器差异覆盖示例：
#
# 台式机热点模式：
# bind-address: 0.0.0.0
# allow-lan: true
#
# 笔记本独立模式：
# bind-address: 127.0.0.1
# allow-lan: false
